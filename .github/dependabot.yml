version: 2
updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 10
    labels: [dependencies, nuget]
    commit-message:
      prefix: "deps(nuget)"

  - package-ecosystem: npm
    directory: "/apps/admin"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 10
    labels: [dependencies, npm]
    commit-message:
      prefix: "deps(npm)"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 5
    labels: [dependencies, actions]
    commit-message:
      prefix: "deps(actions)"

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 5
    labels: [dependencies, docker]
    commit-message:
      prefix: "deps(docker)"
