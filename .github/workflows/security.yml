name: Security

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  schedule:
    # Weekly Monday 05:00 UTC
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  nuget-audit:
    name: NuGet vulnerability audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - run: dotnet restore
      - name: Fail on High/Critical vulnerabilities
        run: |
          set -euo pipefail
          # Human-readable report always
          dotnet list package --vulnerable --include-transitive || true
          # JSON gate for High/Critical
          OUT=$(dotnet list package --vulnerable --include-transitive --format json 2>/dev/null || echo '{}')
          if echo "$OUT" | grep -Eiq '"severity"[[:space:]]*:[[:space:]]*"(Critical|High)"'; then
            echo "$OUT" | head -c 50000
            echo "::error::High or Critical NuGet vulnerabilities detected"
            exit 1
          fi
          echo "No High/Critical NuGet vulnerabilities reported."

  codeql:
    name: CodeQL (C#)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: csharp
          queries: security-extended
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - name: Build for CodeQL
        run: |
          dotnet restore
          dotnet build --no-restore --configuration Release
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:csharp"

  trivy-image:
    name: Trivy scan (Docker image)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: notificationhub:security-scan
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: notificationhub:security-scan
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true
