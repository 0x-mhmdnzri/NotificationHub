name: Architecture Tests

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

jobs:
  architecture:
    name: Layer & dependency rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - run: dotnet restore tests/Architecture/NotificationHub.Architecture.Tests/NotificationHub.Architecture.Tests.csproj
      - run: >
          dotnet test tests/Architecture/NotificationHub.Architecture.Tests/NotificationHub.Architecture.Tests.csproj
          -c Release
          --verbosity normal
          --logger "trx;LogFileName=architecture.trx"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: architecture-test-results
          path: "**/TestResults/**"
