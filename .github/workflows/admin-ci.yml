name: Admin UI (Next.js)

on:
  push:
    branches: [dev, main]
    paths:
      - "apps/admin/**"
      - ".github/workflows/admin-ci.yml"
  pull_request:
    branches: [dev, main]
    paths:
      - "apps/admin/**"
      - ".github/workflows/admin-ci.yml"
  workflow_dispatch:

jobs:
  build:
    name: Lint & build admin
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/admin/package-lock.json
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:5245
          NEXT_TELEMETRY_DISABLED: "1"
