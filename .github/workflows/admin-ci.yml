name: Admin UI (Next.js)

on:
  push:
    branches: [dev, main]
    paths:
      - "apps/admin/**"
      - ".github/workflows/admin-ci.yml"
  pull_request:
    branches: [dev, main]
    paths:
      - "apps/admin/**"
      - ".github/workflows/admin-ci.yml"
  workflow_dispatch:

jobs:
  build:
    name: Lint & build admin
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: apps/admin/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:5245
          NEXT_TELEMETRY_DISABLED: "1"
