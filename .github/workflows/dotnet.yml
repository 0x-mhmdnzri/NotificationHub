name: .NET Build and Test

on:
  push:
    branches: [ dev, main ]
  pull_request:
    branches: [ dev, main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    name: Build and Test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: >
          dotnet test
          --no-build
          --configuration Release
          --verbosity normal
          --logger "trx;LogFileName=dotnet-test-results.trx"
          --collect:"XPlat Code Coverage"

      - name: Publish (Host)
        # Build Host graph explicitly so plugin projects referenced only by Host are produced
        run: >
          dotnet publish src/Host/NotificationHub.Host/NotificationHub.Host.csproj
          -c Release
          -o ./publish
          --no-restore

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-test-results
          path: |
            **/TestResults/**
            **/coverage.cobertura.xml

  nuget-audit:
    runs-on: ubuntu-latest
    name: NuGet vulnerability audit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - run: dotnet restore
      - name: Audit vulnerable packages
        run: |
          set -euo pipefail
          OUT=$(dotnet list package --vulnerable --include-transitive --format json 2>/dev/null || true)
          if echo "$OUT" | grep -qi '"severity":\s*"\(Critical\|High\)"'; then
            echo "$OUT"
            echo "::error::Vulnerable NuGet packages (High/Critical) detected"
            exit 1
          fi
          dotnet list package --vulnerable --include-transitive || true
          echo "No High/Critical vulnerabilities reported."
